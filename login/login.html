<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Home - Connexion</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&family=Mulish:wght@300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <h2>Smart Home</h2>
          <p>Connectez-vous pour accéder à votre tableau de bord</p>
        </div>
        <div class="login-form">
          <form id="loginForm">
            <div class="form-group">
              <label for="username">Nom d'utilisateur</label>
              <input type="text" id="username" name="username" class="form-control" required />
            </div>
            <div class="form-group">
              <label for="password">Mot de passe</label>
              <input type="password" id="password" name="password" class="form-control" required />
            </div>
            <div class="form-check">
              <input type="checkbox" id="remember" name="remember" class="form-check-input" />
              <label for="remember" class="form-check-label">Se souvenir de moi</label>
            </div>
            <div class="login-actions">
              <button type="submit" class="btn btn-primary login-btn">Se connecter</button>
            </div>
          </form>
          <div class="login-options">
            <a href="#" id="forgotPassword">Mot de passe oublié?</a>
            <a href="#" id="createAccount">Créer un compte</a>
          </div>
          <div id="loginMessage" class="alert d-none"></div>
        </div>
      </div>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
  </body>
</html>
